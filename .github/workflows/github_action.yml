name: DNS Block&Redirect Configurer cron task

on:
  schedule:
    - cron: '30 1 * * *' # 04:30 MSK (01:30 UTC)
  workflow_dispatch:
    inputs:
      repair_only:
        description: Apply ChatGPT rewrites only
        type: boolean
        default: false

# Two runs at once read and write the same dns profile, so a new run replaces the one in progress
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: DNS

    env:
      DNS: ${{ vars.DNS }}
      BLOCK: ${{ vars.BLOCK }}
      REDIRECT: ${{ vars.REDIRECT }}
      EXCLUDE_REDIRECT: ${{ vars.EXCLUDE_REDIRECT }}
      DONOR_DNS: ${{ vars.DONOR_DNS }}

      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      TZ: Europe/Moscow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 26
        if: ${{ !inputs.repair_only }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build with Maven
        if: ${{ !inputs.repair_only }}
        run: mvn -B clean package

      - name: Run application
        if: ${{ !inputs.repair_only }}
        run: |
          echo "Starting application..."
          java --enable-preview -jar target/*.jar

      - name: Test ChatGPT rewrite repair
        if: ${{ !cancelled() && env.DNS == 'NEXTDNS' }}
        run: python3 -m unittest discover -s scripts -p 'test_pin_chatgpt_dns.py' -v

      - name: Preserve verified ChatGPT rewrites
        if: ${{ !cancelled() && env.DNS == 'NEXTDNS' }}
        run: python3 scripts/pin_chatgpt_dns.py
